<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MOYO Header</title>

    <!-- Roboto: ONLY 500, roman -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>

  <body>
    <header>
      <!-- LOGO (NOT inside nav) -->
      <a
        href="#"
        class="logo"
      >
        <img
          src="./images/logo.png"
          alt="MOYO logo"
        />
      </a>

      <nav>
        <ul class="nav-list">
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
              data-qa="hover"
            >
              Apple
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
              data-qa="hover"
            >
              Samsung
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
              data-qa="hover"
            >
              Smartphones
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link is-active"
              data-qa="hover"
            >
              Laptops & computers
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
              data-qa="hover"
            >
              Gadgets
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
              data-qa="hover"
            >
              Tablets
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
              data-qa="hover"
            >
              Photo
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
              data-qa="hover"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
